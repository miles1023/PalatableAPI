# Entity YAML Schema Reference
# Every legal field for files in knowledge/entities/
# This is documentation, not a validator.

# Top-level fields
# ─────────────────
# name:                   string  — UE class name exactly as it appears in code
# parent:                 string  — parent class name; resolver walks the chain for inherited properties
# ue_module:              string  — "/Script/Pal", "/Script/Engine", "/Script/CoreUObject", etc.
# discovery_status:       enum    — unverified | partial | confirmed | deprecated | broken
# game_version_confirmed: string  — last game version where this class was verified correct
# notes:                  string  — anything a future RE session should know about this class

# properties:
# ───────────
# Each entry under properties: is one field accessible on this class.
#
# access: reflected   — accessed via UE4SS property-by-name API (no offset needed)
#   ue_property:      string  — exact property name as it appears in UE reflection
#   component:        string  — if property lives on a sub-component, its class name
#   component_chain:  list    — ordered chain when multiple levels deep
#
# access: direct      — raw memory offset (used when property is not in UE reflection)
#   signature:        string  — byte signature for re-resolution after updates
#   addresses:
#     "0.7.1":
#       client:       hex     — client binary address
#       server:       hex     — server binary address (null if not yet found)
#   verified_versions: list   — versions where this offset was confirmed correct
#   broken_since:     string  — version where this broke, null if still working
#
# Common fields (both access types):
#   type:             string  — float | int32 | int64 | bool | FName | FString |
#                               FFixedPoint | FVector | TArray | TMap | UObject*
#   plain_english:    string  — how modders refer to this (used in commands.yml)
#   authority:        enum    — client | server | either
#                               server = writing client-side gets overwritten next tick
#   lifecycle:        list    — which states this offset is valid in
#                               spawned | boxed | egg | dead | any
#   writable:         bool    — false = read-only (writing has no effect or crashes)
#   persistence:      enum    — session (lost on restart) | permanent | unknown
#   side_effects:     string  — describe anything that breaks if you set this naively
#   notes:            string  — RE notes, gotchas, source of discovery

# functions:
# ──────────
# Each entry is a callable UFunction or C++ method.
#
#   ue_function_path: string  — full path for RegisterHook("/Script/Pal.Class:Method")
#                               or "/Game/Pal/Blueprint/..." for Blueprint functions
#   hook_type:        enum    — pre | post | both
#   authority:        enum    — client | server | either
#   lifecycle:        list    — same lifecycle states as properties
#   args:             list    — [{name, type, position}]
#   returns:          string  — return type
#   notes:            string

# api_commands:
# ─────────────
# Plain-English command patterns this entity backs.
#
#   syntax:           string  — command template with {placeholders}
#   backend:          enum    — runtime | datatables
#   returns:
#     success:        string  — message shown on success
#     errors:         list    — [{code, message}]
#       codes: TARGET_NOT_FOUND | VALUE_OUT_OF_RANGE | LIFECYCLE_MISMATCH |
#              NOT_WRITABLE | VERSION_MISMATCH | NOT_CONNECTED | SERVER_AUTHORITY

