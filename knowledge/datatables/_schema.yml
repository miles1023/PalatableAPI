# DataTable YAML Schema Reference
# Every legal field for files in knowledge/datatables/
# DataTables are static game data edited via JSON patches (PalSchema-compatible output).

# Top-level fields
# ─────────────────
# name:           string — DataTable or DataAsset class name (e.g. DT_PalMonsterParameter)
# asset_path:     string — Full UE asset path: /Game/Pal/DataTable/...
# palschema_dir:  string — Which PalSchema mod folder handles this table (pals/items/raw/etc.)
# description:    string — What this table controls
# backend:        always "datatables" for files in this folder
# discovery_status: enum — unverified | partial | confirmed | deprecated | broken
# game_version_confirmed: string

# columns:
# ────────
# Each entry is one column in the DataTable.
#
#   type:           string — UE type: int | float | bool | FName | FString | FText | struct | array
#   plain_english:  string — how modders refer to this column
#   description:    string — what changing this column does in game
#   default:        any    — known default value for reference
#   range:          string — valid range if applicable (e.g. "0.0-100.0")
#   enum:           string — enum type name if this is an enum column
#   enum_values:    list   — known valid values for enum columns
#   notes:          string — RE notes, gotchas

# row_key_format:
# ───────────────
# string — describes how row keys are structured
# e.g. "PalInternalID" or "{PalID}000" or "ItemStaticId"

# api_commands:
# ─────────────
# Plain-English command patterns this table backs.
# Same structure as entity api_commands.

