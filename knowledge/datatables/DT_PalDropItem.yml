name: DT_PalDropItem
asset_path: /Game/Pal/DataTable/Character/DT_PalDropItem
palschema_dir: pals/ (via Loot synthetic field)
description: Drop/loot tables for every Pal species. Up to 10 items per Pal.
backend: datatables
discovery_status: confirmed
game_version_confirmed: "0.7.1"
row_key_format: "{EPalTribeID}000 e.g. SheepBall000, Anubis000"
notes: >
  Best edited via the synthetic Loot field in DT_PalMonsterParameter.yml when using PalSchema.
  Direct raw/ edits are also supported.

columns:
  CharacterId:
    type: FName
    plain_english: pal_species
    description: "Internal Pal ID (EPalTribeID value)"

  ItemId1:
    type: FName
    plain_english: drop_item_1
    description: "Item ID for drop slot 1 (matches DA_StaticItemDataAsset row key)"

  Rate1:
    type: float
    plain_english: drop_chance_1
    description: "Drop probability for slot 1 as percentage 0.0-100.0"
    range: "0.0-100.0"

  min1:
    type: int
    plain_english: drop_min_1
    description: "Minimum quantity dropped from slot 1"

  Max1:
    type: int
    plain_english: drop_max_1
    description: "Maximum quantity dropped from slot 1"

  ItemId2:
    type: FName
    plain_english: drop_item_2
