api_commands:
  - syntax: "set pal-species {name} drop {slot} item {item}"
    backend: datatables
    notes: "slot is 1-10, item is item plain-English name"
    returns:
      success: "Set {name} drop slot {slot} to {item}"
      errors:
        - code: TARGET_NOT_FOUND
          message: "No Pal species named '{name}' found"
        - code: VALUE_OUT_OF_RANGE
          message: "Drop slot must be 1-10"

  - syntax: "set pal-species {name} drop {slot} chance {value}"
    backend: datatables
    notes: "value is 0.0-100.0"
    returns:
      success: "Set {name} drop slot {slot} chance to {value}%"
      errors:
        - code: VALUE_OUT_OF_RANGE
          message: "Drop chance must be between 0.0 and 100.0"

