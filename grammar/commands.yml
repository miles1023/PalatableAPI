# Command Registry — the binding layer between grammar and knowledge base
# grammar/palworld.lark defines the parse structure
# This file defines what each parsed command maps to and how values resolve

# ─── Special Value Mappings ───────────────────────────────────────────────────
special_values:
  infinite: 99999999.0
  max: "<<read_field_max>>"      # reads the corresponding max field at runtime
  min: 0.0
  default: "<<lookup_default>>"  # reads the default from the column definition
  free: 0
  full: "<<read_field_max>>"
  empty: 0.0

# ─── Property Registry ───────────────────────────────────────────────────────
# Maps plain-English property names to entity fields or DataTable columns.
# Resolver picks the right entry based on the command's scope.

properties:
  health:
    aliases: [hp, hitpoints]
    scopes:
      player:
        entity: UPalIndividualCharacterParameter
        field: Hp
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: FFixedPoint
        value_field: Value
      pal:
        entity: UPalIndividualCharacterParameter
        field: Hp
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: FFixedPoint
        value_field: Value

  max_health:
    aliases: [max_hp, maxhp, maxhealth]
    scopes:
      player:
        entity: UPalIndividualCharacterParameter
        field: MaxHP
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: FFixedPoint
        value_field: Value
      pal:
        entity: UPalIndividualCharacterParameter
        field: MaxHP
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: FFixedPoint
        value_field: Value

  hunger:
    aliases: [food, satiety, stomach]
    scopes:
      player:
        entity: UPalIndividualCharacterParameter
        field: FullStomach
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: float
      pal:
        entity: UPalIndividualCharacterParameter
        field: FullStomach
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: float

  sanity:
    aliases: [mental, mentality, san]
    scopes:
      player:
        entity: UPalIndividualCharacterParameter
        field: SanityValue
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: float
        range: [0.0, 100.0]
      pal:
        entity: UPalIndividualCharacterParameter
        field: SanityValue
        access_chain: [CharacterParameterComponent, IndividualParameter]
        value_type: float
        range: [0.0, 100.0]

  invincible:
    aliases: [godmode, god, immortal, invulnerable]
    scopes:
      player:
        entity: UPalCharacterParameterComponent
        field: bIsEnableMuteki
        access_chain: [CharacterParameterComponent]
        value_type: bool

  walkspeed:
    aliases: [walk_speed, speed, movespeed, move_speed]
    scopes:
      player:
        entity: UPalCharacterMovementComponent
        field: MaxWalkSpeed
        access_chain: [CharacterMovement]
        value_type: float
        default: 600.0

  carryweight:
    aliases: [carry_weight, weight_limit, maxweight, max_weight]
    scopes:
      player:
        entity: UPalPlayerInventoryData
        field: MaxInventoryWeight
        access_chain: [Controller, PlayerState, InventoryData]
        value_type: float
      global:
        datatable: DT_PalMonsterParameter
        notes: "No confirmed global carry weight field yet — use player scope"
        status: unimplemented

  capture_rate:
    aliases: [catchrate, catch_rate]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: CaptureRateCorrect
        value_type: float

  base_hp:
    aliases: [base_health, species_hp]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: Hp
        value_type: int

  melee_attack:
    aliases: [melee, attack, atk]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: MeleeAttack
        value_type: int

  ranged_attack:
    aliases: [shot_attack, ranged, range_atk]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: ShotAttack
        value_type: int

  defense:
    aliases: [def, armour, armor_stat]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: Defense
        value_type: int

  run_speed:
    aliases: [speed, run, sprint]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: RunSpeed
        value_type: int

  mount_speed:
    aliases: [ride_speed, ride_sprint]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: RideSprintSpeed
        value_type: int

  nocturnal:
    aliases: [night, nighttime]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: Nocturnal
        value_type: bool

  ai_behavior:
    aliases: [ai, behavior, aggro]
    scopes:
      pal_species:
        datatable: DT_PalMonsterParameter
        column: AIResponse
        value_type: FName
        enum: EPalAIResponseType
        valid_values: [ignore, escape, battle, special]

  price:
    aliases: [cost, value, gold]
    scopes:
      item:
        datatable: DA_StaticItemDataAsset
        column: Price
        value_type: int
      weapon:
        datatable: DA_StaticItemDataAsset
        column: Price
        value_type: int
      food:
        datatable: DA_StaticItemDataAsset
        column: Price
        value_type: int

  max_stack:
    aliases: [stack, stacksize, stack_size]
    scopes:
      item:
        datatable: DA_StaticItemDataAsset
        column: MaxStackCount
        value_type: int

  weight:
    scopes:
      item:
        datatable: DA_StaticItemDataAsset
        column: Weight
        value_type: float

  enabled:
    aliases: [active, legal, obtainable]
    scopes:
      item:
        datatable: DA_StaticItemDataAsset
        column: bLegalInGame
        value_type: bool

  attack:
    scopes:
      weapon:
        datatable: DA_StaticItemDataAsset
        column: AttackValue
        value_type: int

  magazine_size:
    aliases: [mag, ammo, magazine, clip]
    scopes:
      weapon:
        datatable: DA_StaticItemDataAsset
        column: MagazineSize
        value_type: int

  restore_hunger:
    aliases: [food_restore, hunger_restore, satiety_restore]
    scopes:
      food:
        datatable: DA_StaticItemDataAsset
        column: RestoreSatiety
        value_type: int

  restore_hp:
    aliases: [hp_restore, health_restore, heal]
    scopes:
      food:
        datatable: DA_StaticItemDataAsset
        column: RestoreHP
        value_type: int

  hp:
    scopes:
      building:
        datatable: DT_BuildObjectDataTable
        column: Hp
        value_type: int

  craft_time:
    aliases: [work_amount, crafting_time]
    scopes:
      item:
        datatable: DT_ItemRecipeDataTable
        column: WorkAmount
        value_type: float

# ─── Work Suitability Sub-Property ───────────────────────────────────────────
# Handles: "set pal-species Lamball work mining 4"
# word_seq "work mining" -> resolves to WorkSuitability_Mining column

work_suitabilities:
  fire:       { column: WorkSuitability_EmitFlame, aliases: [kindling, flame] }
  watering:   { column: WorkSuitability_Watering, aliases: [water] }
  planting:   { column: WorkSuitability_Seeding, aliases: [seeding, planting, farming_crop] }
  electricity: { column: WorkSuitability_GenerateElectricity, aliases: [electric, power] }
  crafting:   { column: WorkSuitability_Handcraft, aliases: [handiwork, handcraft] }
  gathering:  { column: WorkSuitability_Collection, aliases: [collecting, collection] }
  lumbering:  { column: WorkSuitability_Deforest, aliases: [logging, deforest, woodcutting] }
  mining:     { column: WorkSuitability_Mining, aliases: [mine] }
  oil:        { column: WorkSuitability_OilExtraction, aliases: [oil_extraction] }
  medicine:   { column: WorkSuitability_ProductMedicine, aliases: [medical, pharmacy] }
  cooling:    { column: WorkSuitability_Cool, aliases: [cool, refrigerating] }
  transport:  { column: WorkSuitability_Transport, aliases: [transporting, carrying] }
  farming:    { column: WorkSuitability_MonsterFarm, aliases: [monster_farm, ranch] }

# ─── Error Codes ─────────────────────────────────────────────────────────────
error_codes:
  TARGET_NOT_FOUND:
    description: "The named player, Pal, item, or building was not found"
  VALUE_OUT_OF_RANGE:
    description: "The value given exceeds the allowed range for this property"
  LIFECYCLE_MISMATCH:
    description: "The target exists but is in a state where this property cannot be modified (e.g. boxed Pal)"
  NOT_WRITABLE:
    description: "This property is read-only"
  SERVER_AUTHORITY:
    description: "This property is server-authoritative — change may be overridden"
  NOT_CONNECTED:
    description: "Not connected to a running Palworld instance"
  VERSION_MISMATCH:
    description: "The stored data for this property was verified on a different game version"
  ITEM_NOT_FOUND:
    description: "No item with that name was found — check docs/api.md for valid item names"
  INVENTORY_FULL:
    description: "Target inventory has no room"
  PROPERTY_NOT_FOUND:
    description: "The property name is not recognized — run 'list commands' for valid properties"
  SCOPE_MISMATCH:
    description: "This property does not apply to the given scope (e.g. 'set global health' is invalid)"
  NOT_IMPLEMENTED:
    description: "This command is defined but not yet implemented"
