name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repo-check:
    name: Repo checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run repository checks
        run: python .github/scripts/repo_check.py

