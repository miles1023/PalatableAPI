# CI workflow for PalatableAPI
#
# Runner rationale:
#   ubuntu-latest — GitHub-hosted Ubuntu runner. Appropriate for a documentation and
#   research repository with no Windows-specific build requirements. Fast, free for
#   public repositories, and sufficient for YAML/Markdown linting and schema
#   validation. If the project later requires Windows-only game tools (UE4SS,
#   CheatEngine), a separate self-hosted or windows-latest job can be added.
#
# Jobs:
#   lint-yaml      — Validates all .yml files for correct syntax and style.
#   lint-markdown  — Validates all .md files for correct Markdown syntax.
#   validate-schema — Checks that finding files include all required schema fields.

name: Lint and Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Restrict the GITHUB_TOKEN to read-only access. This workflow only checks out
# code and runs linters; it does not push, create issues, or write packages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-yaml:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint \
            --config-file .yamllint.yml \
            evidence/ findings/ schemas/ survey/ \
            $(find . -maxdepth 1 -name '*.yml' -not -path './.github/*')

  lint-markdown:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            --ignore unknowns/UE4SSforCONTEXTonly \
            '**/*.md'

  validate-schema:
    name: Validate finding schema fields
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate findings against FINDING_SCHEMA.md required fields
        run: python .github/scripts/validate_findings.py
